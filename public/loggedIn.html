<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1 id="welcome-message">Welcome to Cloudmesh!</h1>

    <div id="notification" class="hidden"></div>
    <button type="button" id="home" onclick="window.location.href='/spectrum'">Spectrum</button>
    <button type="button" id="home" onclick="window.location.href='/download'">Download Launcher</button>
    <button type="button", id="discord" onclick="joinDiscord()">Join our Discord Server</button>
    <button type="button" id="logout" onclick="logout()">Logout</button>
</body>

<script>

    function joinDiscord() {
        window.location.href = 'https://discord.gg/r3bJagxvM5';
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }


    const username = getCookie('username');
    if (username) {
        document.getElementById('welcome-message').textContent = `Welcome, ${username}!`;
    }

    async function logout(){
        showNotification("Logging out...", 'warning');
        setTimeout(() => {
            window.location.href = '/logout';
        }, 3000);
    }

    const notification = document.getElementById('notification');
    function showNotification(message, type) {
        notification.textContent = message;
        notification.className = `notification ${type}`;
        setTimeout(() => {
            notification.className = "notification hidden";
        }, 3000);
    }
</script>
</html>
