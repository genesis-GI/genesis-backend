<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis / Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1 class="typing">Login to an account</h1>
    <form id="login-form" onsubmit="event.preventDefault(); submitForm();">
        <input type="text" id="email" placeholder="Enter your email" required>
        <input type="password" id="password" placeholder="Enter a password..." required>
        <button type="submit" id="submit">Submit</button>
    </form>
    <button type="button" id="home" onclick="window.location.href='/'">Home</button>
    <div id="notification" class="hidden"></div>
</body>
<script>
    const password = document.getElementById('password');
    const email = document.getElementById('email');
    const notification = document.getElementById('notification');

    function showNotification(message, type) {
        notification.textContent = message;
        notification.className = `notification ${type}`;
        setTimeout(() => {
            notification.className = "notification hidden";
        }, 3000);
    }

    async function hashPassword(password) {
        try {
            console.log("Hashing password...");
            if (!window.isSecureContext) {
                console.error("Subtle crypto requires a secure context (HTTPS).");
                // Fallback or skip hashing here
                return password;
            }
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashedPassword = Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
            console.log("Password hashed successfully:", hashedPassword);
            return hashedPassword;
        } catch (error) {
            console.error("Hashing error:", error);
            // Fallback or skip hashing here
            return password;
        }
    }

    async function submitForm() {
        console.log("Submitting....");
        if (!/\S/.test(password.value) || !/\S/.test(email.value)) {
            showNotification("Error: Fields cannot be empty", "error");
            return;
        }

        const hashedPassword = await hashPassword(password.value);
        console.log("Hashed Password:", hashedPassword);

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email.value, password: hashedPassword })
            });

            if (response.ok) {
                showNotification("Login successful", "success");
                // Redirect to another page if needed
                window.location.href = '/dashboard';
            } else {
                const errorData = await response.json();
                showNotification(`Login failed: ${errorData.message}`, "error");
            }
        } catch (error) {
            console.error("Request error:", error);
            showNotification("Login failed: Network error", "error");
        }
    }
</script>
</html>
