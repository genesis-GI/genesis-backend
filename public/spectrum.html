<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudmesh -> Spectrum</title>

    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden; /* Prevent body from scrolling */
        }
        #sidebar {
            width: 200px;
            background-color: #162447;
            padding: 10px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #sidebar h2 {
            color: #e0e0e0;
        }
        #sidebar button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background-color: #1f4068;
            color: #e0e0e0;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #sidebar button:hover, #sidebar button.active {
            background-color: #1b1b2f;
        }
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            margin-left: 220px; /* Increased margin to add space */
            margin-right: 220px; /* Increased margin to add space */
            overflow: hidden; /* Prevent main content from scrolling */
        }
        #userbar {
            width: 200px;
            background-color: #162447;
            padding: 10px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
        }
        #userbar h2 {
            color: #e0e0e0;
        }
        .staff, .backer {
            display: flex;
            align-items: center;
        }
        .staff::before,
        .backer::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .staff.online::before,
        .backer.online::before {
            background-color: green;
        }
        .staff.away::before,
        .backer.away::before {
            background-color: yellow;
        }
        .staff.offline::before,
        .backer.offline::before {
            background-color: gray;
        }
        .staff.dnd::before,
        .backer.dnd::before {
            background-color: red;
        }
        .staff.playing::before,
        .backer.playing::before {
            background-color: blue;
        }
        .staff {
            color: gold;
        }
        .backer {
            color: #1f78d1;
        }
        #notification {
            background-color: #28a745; /* Green color for success */
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            color: #e0e0e0;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
        #notification.error {
            background-color: #dc3545; /* Red color for error */
        }
        #notification.hidden {
            display: none;
        }
        #motd {
            background-color: #2a2a4e;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            position: relative;
        }
        #motd h2 {
            margin: 0;
        }
        #editMotdButton {
            position: absolute;
            top: 0;
            right: 220px; /* Adjusted to be next to the user bar */
            padding: 10px;
            background-color: #1f4068;
            color: #e0e0e0;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        #createChannelButton, #homeButton {
            padding: 10px;
            background-color: #1f4068;
            color: #e0e0e0;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1f4068;
            border-radius: 5px;
            padding: 10px;
            overflow: hidden; /* Prevent chat container from scrolling */
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto; /* Make chat messages scrollable */
            margin-bottom: 10px;
        }
        #chat-messages::-webkit-scrollbar {
            width: 12px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #1f4068;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background-color: #888;
            border-radius: 10px;
            border: 3px solid #1f4068;
        }
        #chat-input {
            display: flex;
        }
        #chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
            background-color: #2a2a4e;
            color: #e0e0e0;
        }
        #chat-input button {
            padding: 10px;
            background-color: #1b1b2f;
            color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .star {
            cursor: pointer;
        }
        .star.filled {
            color: gold;
        }
        .trash {
            cursor: pointer;
            color: red;
            margin-left: 10px;
            z-index: 1;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #2a2a4e;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            position: relative;
        }
        .modal-content textarea {
            width: 100%;
            height: 150px;
            resize: vertical;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #1f4068;
            color: #e0e0e0;
        }
        .modal-content button {
            padding: 10px;
            background-color: #1b1b2f;
            color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
        a {
            color: #1f78d1; /* Blue color for links */
        }
        a:visited {
            color: #1f78d1; /* Ensure visited links are also blue */
        }
        .message-time {
            font-size: smaller;
            color: gray;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div>
            <h2>Channels</h2>
            <div id="channels-list">
                <!-- Channels will be dynamically loaded here -->
            </div>
        </div>
        <div>
            <button id="createChannelButton" onclick="openCreateChannelModal()">Create Channel</button>
            <button id="homeButton" onclick="window.location.href='/'">Home</button>
        </div>
    </div>
    <div id="main-content">
        <div id="current-channel">
            <h2>Current Channel: <span id="currentChannelName">genesis-testing-chat</span></h2>
            <button id="editMotdButton" style="display: none;" onclick="openMotdEditor()">Edit MOTD</button>
        </div>
        <div id="motd">
            <h2>Message of the Day <small id="lastChanged" style="color: gray; font-size: smaller;"></small></h2>
            <p id="message"></p>
        </div>
        <div id="chat">
            <div id="chat-messages"></div>
            <div id="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message..." />
                <button id="sendMessageBtn">Send</button>
            </div>
        </div>
    </div>
    <div id="userbar">
        <h2>Users</h2>
        <h3>Staff</h3>
        <div id="staff-list">
            <!-- Staff users will be dynamically added here -->
        </div>
        <h3>Backers</h3>
        <div id="backers-list">
            <!-- Backers users will be dynamically added here -->
        </div>
        <div>
            <label for="statusDropdown">Set Status:</label>
            <select id="statusDropdown" onchange="handleStatusChange(this.value)">
                <option value="online">Online</option>
                <option value="away">Away</option>
                <option value="offline">Offline</option>
                <option value="dnd">Do Not Disturb</option>
                <option value="playing">Playing</option>
            </select>
        </div>
    </div>

    <!-- The Modal -->
    <div id="motdModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeMotdEditor()">&times;</span>
            <h2>Edit Message of the Day</h2>
            <textarea id="motdTextarea"></textarea>
            <button onclick="saveMotd()">Save</button>
        </div>
    </div>

    <!-- Create Channel Modal -->
    <div id="createChannelModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCreateChannelModal()">&times;</span>
            <h2>Create New Channel</h2>
            <input type="text" id="newChannelName" placeholder="Channel Name">
            <button onclick="createChannel()">Create</button>
        </div>
    </div>

    <div id="notification" class="hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            autoLogin();
            fetchUsers();
            listenForStatusUpdates();
            setInterval(updateMessageTimes, 1000); // Update message times every second for real-time effect
        });

        // Remove or comment out the beforeunload listener to avoid forcing offline on reload
        // window.addEventListener('beforeunload', async () => {
        //     console.log("User is leaving the page");
        //     console.log("Setting user status to offline");
        //     await setUserStatus("offline", false);
        // });

        document.getElementById('homeButton').addEventListener('click', () => {
            console.log("User is leaving the page");
            console.log("Setting user status to offline");
            setUserStatus("offline", false).then(() => {
                window.location.href = '/';
            });
        });

        async function setUserStatus(newStatus, updateWantedStatus = false) {
            try {
                // Set the new status
                await fetch("/spectrum/status", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status: newStatus })
                });

                // Optionally save the new status as the wanted status
                if (updateWantedStatus) {
                    const userEmail = await getCurrentUserEmail();
                    await fetch(`/spectrum/setUserWantedStatus/${userEmail}/${newStatus}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" }
                    });
                }
               if(updateWantedStatus){
                console.log("Setting wanted status ")
               }

                console.log("Status set to:", newStatus);
                if (updateWantedStatus) {
                    console.log("Wanted status set to:", newStatus);
                }
            } catch (error) {
                console.error("Error setting user status:", error);
            }
        }

        async function getCurrentUserEmail() {
            const response = await fetch('/auto-login');
            if (response.ok) {
                const user = await response.json();
                return user.email;
            } else {
                throw new Error("Failed to fetch user email");
            }
        }

        async function autoLogin() {
            try {
                const response = await fetch('/auto-login');
                if (response.ok) {
                    const user = await response.json();
                    if (user.admin) {
                        document.getElementById('editMotdButton').style.display = 'block';
                        document.getElementById('createChannelButton').style.display = 'block';
                    } else {
                        document.getElementById('createChannelButton').style.display = 'none';
                    }

                    // Set the current user status to the wanted status here

                    // Fetch and set the wanted status in the dropdown
                    const wantedStatusResponse = await fetch(`/spectrum/getUserWantedStatus/${user.email}`);
                    if (wantedStatusResponse.ok) {
                        const wantedStatusData = await wantedStatusResponse.json();
                        const wantedStatus = wantedStatusData.status;

                        // Set the dropdown to the wanted status
                        const statusDropdown = document.getElementById('statusDropdown');
                        if (statusDropdown) {
                            statusDropdown.value = wantedStatus;
                            setUserStatus(wantedStatus, false); // immediately use wanted status as current
                        }
                    } else {
                        console.error("Failed to fetch wanted status");
                    }

                    loadChannels();
                    switchChannel('genesis-testing-chat');
                    fetchUsers();
                } else {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error during auto-login:', error);
                window.location.href = '/login';
            }
        }

        function formatTime(seconds) {
            if (seconds < 60) {
                return 'a few seconds ago';
            }
            const minutes = Math.floor(seconds / 60);
            if (minutes == 1) {
                return `${minutes} minute ago`;
            } else if (minutes < 60) {
                return `${minutes} minutes ago`;
            }

            const hours = Math.floor(minutes / 60);
            if (hours == 1) {
                return `${hours} hour ago`;
            } else if (hours < 24) {
                return `${hours} hours ago`;
            }

            const days = Math.floor(hours / 24);
            if (days == 1) {
                return `${days} day ago`;
            } else {
                return `${days} days ago`;
            }
        }

        let currentEventSource;
        let lastChangedInterval;

        function updateLastChanged(date) {
            if (lastChangedInterval) {
                clearInterval(lastChangedInterval);
            }
            function refresh() {
                const now = new Date();
                const secondsDiff = Math.floor((now - date) / 1000);
                document.getElementById('lastChanged').innerText = formatTime(secondsDiff);
            }
            refresh();
            lastChangedInterval = setInterval(refresh, 60000);
        }

        function updateMessageTimes() {
            const now = new Date();
            document.querySelectorAll('.message-time').forEach(span => {
                const timestamp = new Date(parseInt(span.dataset.timestamp));
                const secondsDiff = Math.floor((now - timestamp) / 1000);
                span.innerText = formatTime(secondsDiff);
            });
        }

        async function switchChannel(channel) {
            console.log('Switching to channel:', channel);
            // If you want to force all channels to lower-case in Firestore:
            channel = channel.toLowerCase();

            document.getElementById('messageInput').placeholder = `Message ${channel}`;
            document.getElementById('currentChannelName').innerText = channel;
            document.querySelectorAll('#channels-list button').forEach(btn => btn.classList.remove('active'));
            const channelButton = document.getElementById(channel);
            if (channelButton) {
                channelButton.classList.add('active');
            }

            try {
                const response = await fetch(`/spectrum/${channel}/motd`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('message').innerHTML = parseMarkdown(data.message);

                    if (data.date && data.date._seconds !== undefined && data.date._nanoseconds !== undefined) {
                        const date = new Date((data.date._seconds * 1000) + (data.date._nanoseconds / 1000000));
                        updateLastChanged(date);
                    } else if (data.date && typeof data.date === 'string') {
                        const parsed = new Date(data.date);
                        if (!isNaN(parsed.getTime())) {
                            updateLastChanged(parsed);
                        } else {
                            document.getElementById('lastChanged').innerText = '';
                        }
                    } else {
                        document.getElementById('lastChanged').innerText = '';
                    }
                } else {
                    console.error('Failed to fetch MOTD:', response.statusText);
                }
            } catch (error) {
                console.error('Error fetching MOTD:', error);
            }

            try {
                const response = await fetch(`/spectrum/${channel}/messages`);
                if (response.ok) {
                    const messages = await response.json();
                    renderMessages(messages);
                }
            } catch (error) {
                console.error('Error fetching messages:', error);
            }

            listenForMOTDUpdates(channel);
            listenForMessageUpdates(channel);
        }

        async function checkCurrentUser() {
            try {
                const response = await fetch('/spectrum/currentUser');
                if (response.ok) {
                    const user = await response.json();
                    if (user.admin) {
                        document.getElementById('editMotdButton').style.display = 'block';
                        document.getElementById('createChannelButton').style.display = 'block';
                    } else {
                        document.getElementById('createChannelButton').style.display = 'none';
                    }
                    await loadStarredChannels(user.email);
                    sortChannels();
                } else {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error fetching current user:', error);
                window.location.href = '/';
            }
        }

        async function loadChannels() {
            try {
                const response = await fetch('/spectrum/channels');
                if (response.ok) {
                    const channels = await response.json();
                    updateChannelsList(channels);
                } else {
                    console.error('Failed to load channels:', response.statusText);
                }
            } catch (error) {
                console.error('Error loading channels:', error);
            }

            // Listen for real-time updates
            //listenForChannelUpdates();
        }

        function updateChannelsList(channels) {
            const channelsList = document.getElementById('channels-list');
            channelsList.innerHTML = '';
            channels.forEach(channel => {
                const button = document.createElement('button');
                button.id = channel;
                button.innerHTML = `${channel} <span class="star" onclick="starChannel(event, '${channel}')">☆</span>`;
                try{
                if (document.getElementById('current-user').innerHTML.includes('Admin: true')) {
                    const trashIcon = document.createElement('span');
                    trashIcon.classList.add('trash');
                    trashIcon.innerHTML = '🗑️';
                    trashIcon.onclick = (event) => deleteChannel(event, channel);
                    button.appendChild(trashIcon);
                }
                button.onclick = () => switchChannel(channel);
                channelsList.appendChild(button);
                } catch (error) {
                    console.error('Error updating channels list:', error);
                }
            });
        }

        function listenForChannelUpdates() {
            const eventSource = new EventSource('/spectrum/channels/updates');
            eventSource.onmessage = function(event) {
                const channels = JSON.parse(event.data);
                try{
                updateChannelsList(channels);
                }catch(error){
                    console.log("Error while listening for channel updates")
                }
            };
        }

        async function loadStarredChannels(email) {
            try {
                const response = await fetch(`/spectrum/starredChannels/${email}`);
                if (response.ok) {
                    const starredChannels = await response.json();
                    updateStarredChannels(starredChannels);
                } else {
                    console.error('Failed to load starred channels:', response.statusText);
                }
            } catch (error) {
                console.error('Error loading starred channels:', error);
            }

            // Listen for real-time updates
            listenForStarredChannelUpdates(email);
        }

        function updateStarredChannels(starredChannels) {
            starredChannels.forEach(channel => {
                const star = document.querySelector(`#${channel} .star`);
                if (star) {
                    star.classList.add('filled');
                    star.innerText = '★';
                }
            });
        }

        function listenForStarredChannelUpdates(email) {
            const eventSource = new EventSource(`/spectrum/starredChannels/updates/${email}`);
            eventSource.onmessage = function(event) {
                const starredChannels = JSON.parse(event.data);
                updateStarredChannels(starredChannels);
            };
        }

        async function starChannel(event, channel) {
            event.stopPropagation();
            const star = event.target;
            const isStarred = star.classList.contains('filled');
            star.classList.toggle('filled');
            star.innerText = isStarred ? '☆' : '★';

            try {
                await fetch(`/spectrum/starChannel/${channel}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isStarred: !isStarred })
                });
            } catch (error) {
                console.error('Error starring channel:', error);
            }
        }

        async function deleteChannel(event, channel) {
            event.stopPropagation();
            try {
                const response = await fetch(`/spectrum/channel/${channel}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadChannels();
                }
            } catch (error) {
                console.error('Error deleting channel:', error);
            }
        }

        async function createChannel() {
            const newChannelName = document.getElementById('newChannelName').value;
            try {
                const response = await fetch('/spectrum/channel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channelName: newChannelName })
                });
                if (response.ok) {
                    closeCreateChannelModal();
                    loadChannels();
                }
            } catch (error) {
                console.error('Error creating channel:', error);
            }
        }

        function sortChannels() {
            const channelsList = document.getElementById('channels-list');
            const buttons = Array.from(channelsList.querySelectorAll('button'));
            const starred = buttons.filter(button => button.querySelector('.star').classList.contains('filled'));
            const unstarred = buttons.filter(button => !button.querySelector('.star').classList.contains('filled'));

            starred.sort((a, b) => a.innerText.localeCompare(b.innerText));
            unstarred.sort((a, b) => a.innerText.localeCompare(b.innerText));

            channelsList.innerHTML = '';
            starred.forEach(button => channelsList.appendChild(button));
            unstarred.forEach(button => channelsList.appendChild(button));
        }

        async function fetchUsers() {
            try {
                const res = await fetch("/spectrum/users");
                const data = await res.json();
                renderUserList(data.staff, "staff-list");
                renderUserList(data.backers, "backers-list");
            } catch (error) {
                console.error("Error fetching users:", error);
            }
        }

        function renderUserList(users, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            users.forEach(entry => {
                const [username, status] = entry.split("|");
                const div = document.createElement("div");
                div.textContent = username;

                if (containerId === "staff-list") {
                    div.classList.add("staff");
                } else if (containerId === "backers-list") {
                    div.classList.add("backer");
                }

                if (status === "online") {
                    div.classList.add("online");
                } else if (status === "away") {
                    div.classList.add("away");
                } else if (status === "dnd") {
                    div.classList.add("dnd");
                } else if (status === "playing") {
                    div.classList.add("playing");
                } else {
                    div.classList.add("offline");
                }

                container.appendChild(div);
            });
        }

        function openMotdEditor() {
            const motdText = document.getElementById('message').innerHTML;
            const markdownText = motdText.replace(/<a href="([^"]+)" target="_blank">([^<]+)<\/a>/g, '[$2]($1)').replace(/<br>/g, '\n');
            document.getElementById('motdTextarea').value = markdownText;
            document.getElementById('motdModal').style.display = 'block';
        }

        function closeMotdEditor() {
            document.getElementById('motdModal').style.display = 'none';
        }

        async function saveMotd() {
            const newMotd = document.getElementById('motdTextarea').value;
            const channel = document.getElementById('currentChannelName').innerText;
            try {
                const response = await fetch(`/spectrum/motd/${channel}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: newMotd })
                });
                if (response.ok) {
                    showNotification('Lobby MOTD has been successfully updated', 'success');
                    switchChannel(channel);
                    closeMotdEditor();
                } else {
                    showNotification('Failed to update Lobby MOTD', 'error');
                }
            } catch (error) {
                console.error('Error updating MOTD:', error);
                showNotification('Error updating MOTD', 'error');
            }
        }

        function openCreateChannelModal() {
            document.getElementById('createChannelModal').style.display = 'block';
        }

        function closeCreateChannelModal() {
            document.getElementById('createChannelModal').style.display = 'none';
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.innerText = message;
            notification.className = type === 'success' ? '' : 'error';
            notification.classList.remove('hidden');
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3000);
        }

        function parseMarkdown(text) {
            const linkPattern = /\[([^\]]+)\]\(([^)]+)\)/g;
            const newlinePattern = /\n/g;
            return text.replace(linkPattern, '<a href="$2" target="_blank">$1</a>').replace(newlinePattern, '<br>');
        }

        function listenForMOTDUpdates(channel) {
            if (currentEventSource) {
                currentEventSource.close();
            }
            currentEventSource = new EventSource(`/spectrum/${channel}/motd/updates`);
            currentEventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                document.getElementById('message').innerHTML = parseMarkdown(data.message);
                const date = new Date(data.date._seconds * 1000 + data.date._nanoseconds / 1000000);
                updateLastChanged(date);
            };
        }

        function handleStatusChange() {
            const newStatus = document.getElementById('statusDropdown').value;
            setUserStatus(newStatus, true); // also update wanted status
        }

        function listenForStatusUpdates() {
            const eventSource = new EventSource('/spectrum/status/updates');
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                renderUserList(data.staff, "staff-list");
                renderUserList(data.backers, "backers-list");
            };
        }

        let lastActivity = Date.now();
        const AWAY_TIMEOUT = 3 * 60 * 1000;

        document.addEventListener("click", resetActivity);
        document.addEventListener("keydown", resetActivity);

        function resetActivity() {
            lastActivity = Date.now();
            const currentStatus = document.getElementById('statusDropdown').value;
            if (currentStatus === "away") {
                setUserStatus("online", false);
            }
        }

        setInterval(() => {
            const currentStatus = document.getElementById('statusDropdown').value;
            if (currentStatus === "online" && Date.now() - lastActivity >= AWAY_TIMEOUT) {
                setUserStatus("away", false);
            }
        }, 60000);

        document.getElementById('sendMessageBtn').addEventListener('click', async () => {
            const channel = "genesis-testing-chat";
            const msg = document.getElementById('messageInput').value.trim();
            if(msg) {
                await fetch(`/spectrum/messages/${channel}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                document.getElementById('messageInput').value = "";
            }
        });

        document.getElementById('messageInput').addEventListener('keypress', async (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                const channel = document.getElementById('currentChannelName').innerText;
                const msg = document.getElementById('messageInput').value.trim();
                if (msg) {
                    await fetch(`/spectrum/messages/${channel}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: msg })
                    });
                    document.getElementById('messageInput').value = "";
                    const chatContainer = document.getElementById('chat-messages');
                    chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to bottom after sending a message
                }
            }
        });

        async function deleteMessage(channel, messageID) {
            try {
                const response = await fetch(`/spectrum/messages/${channel}/${messageID}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    showNotification('Message deleted successfully', 'success');
                    switchChannel(channel);
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error, 'error');
                }
            } catch (error) {
                console.error('Error deleting message:', error);
                showNotification('Error deleting message', 'error');
            }
        }

        function renderMessages(messages) {
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = '';
            messages.forEach(msg => {
                const p = document.createElement('p');
                const rawTime = msg["timestamp"];
                if (rawTime && rawTime._seconds !== undefined) {
                    const dt = new Date(rawTime._seconds * 1000 + rawTime._nanoseconds / 1e6);
                    const now = new Date();
                    const secondsDiff = Math.floor((now - dt) / 1000);
                    const timeLabel = formatTime(secondsDiff);
                    p.innerHTML = `<span class="username">${msg["username"]}</span> [<span class="message-time" data-timestamp="${dt.getTime()}">${timeLabel}</span>]: ${msg["message"]}`;
                    p.style.color = msg["admin"] ? 'gold' : '#1f78d1';
                } else {
                    p.innerHTML = `<span class="username">${msg["username"]}</span>: ${msg["message"]}`;
                    p.style.color = msg["admin"] ? 'gold' : '#1f78d1';
                }
                chatContainer.appendChild(p);
            });
        }

        function listenForMessageUpdates(channel) {
            if (currentEventSource) {
                currentEventSource.close();
            }
            currentEventSource = new EventSource(`/spectrum/${channel}/messages/updates`);
            currentEventSource.onmessage = function(event) {
                const messages = JSON.parse(event.data);
                renderMessages(messages);
            };
        }

        // Ensure we scroll to the bottom on initial load
        document.addEventListener('DOMContentLoaded', () => {
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        function timeAgo(date) {            const now = new Date();
            const secondsElapsed = Math.floor((now - date) / 1000);
            if (secondsElapsed < 60) {
                return `${secondsElapsed} second${secondsElapsed === 1 ? '' : 's'} ago`;
            }
            const minutesElapsed = Math.floor(secondsElapsed / 60);
            if (minutesElapsed < 60) {
                return `${minutesElapsed} minute${minutesElapsed === 1 ? '' : 's'} ago`;
            }
            const hoursElapsed = Math.floor(minutesElapsed / 60);
            if (hoursElapsed < 24) {
                return `${hoursElapsed} hour${hoursElapsed === 1 ? '' : 's'} ago`;
            }
            const daysElapsed = Math.floor(hoursElapsed / 24);
            return `${daysElapsed} day${daysElapsed === 1 ? '' : 's'} ago`;
        }
    </script>
</body>
</html>
