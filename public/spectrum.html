<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudmesh / Spectrum</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="notification" class="notification warning">
        <h2>Message of the Day <small id="lastChanged" style="color: gray; font-size: smaller;"></small></h2>
        <p id="message"></p>
    </div>
    <h1>What will we do here? </h1>
    <h3>The Spectrum will be a platform to chat with other backers or Developers about the Game</h3>
    <h3>The Team will post all news here in the future</h3>
</body>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/spectrum/motd/genesis-testing-chat');
            if (response.ok) {
                const data = await response.json();
                document.getElementById('message').innerText = data.message;
                document.getElementById('lastChanged').innerText = data.lastChanged;
            } else {
                console.error('Failed to fetch MOTD:', response.statusText);
            }
        } catch (error) {
            console.error('Error fetching MOTD:', error);
        }
    });
</script>
</html>
