name: Deploy

on:
  push:
    branches:
      - Production
      - Dev
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 2222
        script: |
          # Assign the GitHub ref to GITHUB_REF
          GITHUB_REF="${{ github.ref }}"
          echo "Deploying branch $GITHUB_REF"
          
          # Ensure GITHUB_REF is set
          if [ -z "$GITHUB_REF" ]; then
            echo "GITHUB_REF is not set"
            exit 1
          fi

          # Extract the branch name from GITHUB_REF and convert it to lowercase
          BRANCH_NAME="${GITHUB_REF##*/}"  # Extract the branch name from refs/heads/branch-name
          CONTAINER_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')  # Convert to lowercase
          echo "Branch Name: $BRANCH_NAME"
          echo "Container Name: $CONTAINER_NAME"
          
          # Set the port based on the branch
          case "$CONTAINER_NAME" in
            "production")
              OUTGOING_PORT=8088
              ;;
            "dev")
              OUTGOING_PORT=8089
              ;;
            "qa")
              OUTGOING_PORT=8090
              ;;
            *)
              echo "Unknown branch, setting default port 8080"
              OUTGOING_PORT=8080
              ;;
          esac
          echo "Using port: $OUTGOING_PORT"
          
          # Navigate to the project directory
          cd /home/${{ secrets.SSH_USER }}/genesis-backend || exit 1
          
          # Stop and remove the old container
          echo "Stopping and removing container: cmb-$CONTAINER_NAME"
          docker stop "cmb-$CONTAINER_NAME" || true
          docker rm "cmb-$CONTAINER_NAME" || true
          
          # Copy the built image from the CI runner to the server
          echo "Loading image into Docker"
          docker save "cmb-$CONTAINER_NAME:latest" | bzip2 | sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} 'bzcat | docker load'
          
          # Run the new container with the correct port and restart policy
          echo "Running new container: cmb-$CONTAINER_NAME"
          docker run -d --name "cmb-$CONTAINER_NAME" \
            --restart always \
            -p "$OUTGOING_PORT:$OUTGOING_PORT" \
            "cmb-$CONTAINER_NAME:latest"