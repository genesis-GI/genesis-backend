name: Deploy Project

on:
  push:
    branches:
      - Production
      - Dev
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up branch name and container name
      id: vars
      run: |
        BRANCH_NAME="${GITHUB_REF##*/}"
        CONTAINER_NAME=$(echo $BRANCH_NAME | tr '[:upper:]' '[:lower:]')
        echo "::set-output name=branch_name::$BRANCH_NAME"
        echo "::set-output name=container_name::$CONTAINER_NAME"

    - name: Build Docker image
      run: docker build -t cmb-${{ steps.vars.outputs.container_name }} .

    - name: Save Docker image to file
      run: docker save cmb-${{ steps.vars.outputs.container_name }} | bzip2 > cmb-${{ steps.vars.outputs.container_name }}.tar.bz2

    - name: Transfer Docker image to server
      uses: appleboy/scp-action@v0.1.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 2222
        source: cmb-${{ steps.vars.outputs.container_name }}.tar.bz2
        target: /home/***/genesis-backend/

    - name: Set up SSH for deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 2222
        script: |
          SERVER_IP="81.10.229.31"
          echo "Deploying branch ${{ steps.vars.outputs.branch_name }}"
          
          # Extract branch name
          BRANCH_NAME="${{ steps.vars.outputs.branch_name }}"
          echo "Branch Name: $BRANCH_NAME"  # Debugging output

          # Ensure the branch name is not empty
          if [ -z "$BRANCH_NAME" ]; then
            echo "ERROR: Branch name extraction failed"
            exit 1
          fi

          CONTAINER_NAME=$(echo $BRANCH_NAME | tr '[:upper:]' '[:lower:]')  # Convert branch name to lowercase for the container name
          echo "Container Name: $CONTAINER_NAME"  # Debugging output

          # Set the port based on the branch
          case "$CONTAINER_NAME" in
            "production")
              OUTGOING_PORT=8088
              ;;
            "dev")
              OUTGOING_PORT=8086
              ;;
            "qa")
              OUTGOING_PORT=8087
              ;;
            *)
              echo "Unknown branch, setting default port 8079"
              OUTGOING_PORT=8079
              ;;
          esac
          echo "Using port: $OUTGOING_PORT"

          # Navigate to the project directory
          cd /home/***/genesis-backend || exit 1

          # Stop and remove the old container if it exists
          echo "Stopping and removing container: cmb-$CONTAINER_NAME"
          docker stop cmb-$CONTAINER_NAME || true
          docker rm cmb-$CONTAINER_NAME || true

          # Load the built image into Docker
          echo "Loading image into Docker"
          bzip2 -d cmb-${{ steps.vars.outputs.container_name }}.tar.bz2
          docker load < cmb-${{ steps.vars.outputs.container_name }}.tar

          # Run the new container with the correct port and restart policy
          echo "Running new container: cmb-$CONTAINER_NAME"
          docker run -d --name cmb-$CONTAINER_NAME \
            --restart always \
            -p $OUTGOING_PORT:8088 \
            cmb-$CONTAINER_NAME:latest

          # Add debugging steps to check container logs and status
          echo "Checking container logs"
          docker logs cmb-$CONTAINER_NAME

          echo "Checking container status"
          docker ps -a