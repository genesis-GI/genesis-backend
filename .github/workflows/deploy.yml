name: Deploy to Self-Hosted Server

on:
  push:
    branches:
      - Production
      - Dev
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Set branch-specific settings
        id: settings
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_NAME_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
          
          case "$BRANCH_NAME" in
            Production) PORT=8088 ;;
            QA) PORT=8087 ;;
            Dev) PORT=8086 ;;
            *) echo "Branch not configured for deployment"; exit 1 ;;
          esac
          
          echo "PORT=$PORT" >> $GITHUB_ENV
          echo "CONTAINER_NAME=cmb-$BRANCH_NAME_LOWER" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t myapp:${{ github.ref_name }} .

      - name: Deploy to server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
          "docker stop $CONTAINER_NAME || true && docker rm $CONTAINER_NAME || true && docker run -d --name $CONTAINER_NAME -p $PORT:80 myapp:${{ github.ref_name }}"
