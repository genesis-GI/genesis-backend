name: Deploy to Self-Hosted Server

on:
  push:
    branches:
      - Production
      - Dev
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Build Docker image
      run: |
        BRANCH_NAME="${{ github.ref }}"
        CONTAINER_NAME=$(echo $BRANCH_NAME | sed 's/refs\/heads\///' | tr '[:upper:]' '[:lower:]')
        docker build -t cmb-$CONTAINER_NAME:latest .

    - name: Set outgoing port based on branch
      id: set_ports
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/Production" ]]; then
          echo "OUTGOING_PORT=8088" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/Dev" ]]; then
          echo "OUTGOING_PORT=8086" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/QA" ]]; then
          echo "OUTGOING_PORT=8087" >> $GITHUB_ENV
        fi
        echo "Selected outgoing port for ${{ github.ref }}: $OUTGOING_PORT"

    - name: Deploy to self-hosted server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 2222
        script: |
          echo "Deploying branch ${{ github.ref }}"

          # Navigate to the correct directory where the project is located
          cd /home/${{ secrets.SSH_USER }}/genesis-backend || exit 1

          # Stop and remove old container (convert to lowercase manually)
          BRANCH_NAME="${{ github.ref }}" 
          CONTAINER_NAME=$(echo $BRANCH_NAME | sed 's/refs\/heads\///' | tr '[:upper:]' '[:lower:]')

          docker stop cmb-$CONTAINER_NAME:latest || true
          docker rm cmb-$CONTAINER_NAME:latest || true

          # Copy the built image from the CI runner to the server
          docker save cmb-$CONTAINER_NAME:latest | bzip2 | sshpass -p ${{ secrets.SSH_PASSWORD }} ssh ${{ secrets.SSH_USER }}@$SERVER_IP 'docker load < bzcat > /tmp/cmb-$CONTAINER_NAME.tar.bz2'

          # Run the new container with the correct port and restart policy
          docker run -d --name cmb-$CONTAINER_NAME:latest \
            --restart always \
            -p $OUTGOING_PORT:$OUTGOING_PORT \
            cmb-$CONTAINER_NAME:latest
